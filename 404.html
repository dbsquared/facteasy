<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · FactEasy</title>
<style>
  :root{
    --bg:#0b0e13;
    --panel:#151b25;
    --line:#252d3a;
    --line-soft:#1e2632;
    --txt:#e7edf5;
    --txt-dim:#9aa7b8;
    --txt-faint:#66748a;
    --accent:#e0a45a;
    --accent-soft:rgba(224,164,90,.14);
    --accent-2:#7fb2ff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:
      radial-gradient(900px 500px at 20% -10%, rgba(224,164,90,.07), transparent 60%),
      radial-gradient(700px 400px at 100% 0%, rgba(127,178,255,.06), transparent 55%),
      var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.65;
  }
  a{color:var(--accent-2);text-decoration:none;}
  .box{
    max-width:520px;text-align:center;
    background:linear-gradient(180deg,var(--panel) 0%,#11161f 100%);
    border:1px solid var(--line-soft);border-radius:16px;
    padding:40px 34px;
  }
  .code{
    font-size:46px;font-weight:800;letter-spacing:2px;
    background:linear-gradient(100deg,var(--accent),#f2c78a);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    margin-bottom:6px;
  }
  h1{margin:0 0 10px;font-size:19px;font-weight:650;}
  p{margin:0 0 22px;color:var(--txt-dim);font-size:14px;}
  .links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .btn{
    padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;
    border:1px solid var(--line);background:rgba(255,255,255,.02);
    transition:background .16s,border-color .16s;
  }
  .btn:hover{background:rgba(255,255,255,.05);border-color:#334052;}
  .btn.primary{
    background:linear-gradient(135deg,var(--accent),#cc863f);
    color:#26180a;border-color:transparent;
  }
  .hint{margin-top:20px;font-size:12px;color:var(--txt-faint);}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>这个页面不存在</h1>
    <p>链接可能已经失效，或者文件被移动过。你可以从下面重新进入。</p>
    <div class="links">
      <a class="btn primary" href="index.html">返回首页</a>
      <a class="btn" href="videos.html">视频列表</a>
    </div>
    <div class="hint">FactEasy · 事实核查工作台</div>
  </div>
</body>
</html>
